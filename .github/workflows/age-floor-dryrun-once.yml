# TEMPORARY — one-off age-floor DRY RUN, triggered by pushing this branch.
# Exists only because the GitHub integration used by the assistant cannot
# dispatch workflow_dispatch events (403). Identical to the age-floor job in
# cron.yml but hard-wired to dry=true (read-only, writes nothing). Delete the
# branch after reading the results; this file must never land on main.
name: Age Floor Dry Run (one-off)

on:
  push:
    branches:
      - claude/age-floor-dryrun

jobs:
  age-floor-dry:
    name: Age Floor Sweep (dry run)
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 15
    env:
      SITE_URL: ${{ secrets.SITE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Sweep deterministic age floors (dry=true)
        run: |
          set +e
          echo "::group::Age floor sweep (dry=true)"
          after=""
          total_raised=0
          total_processed=0
          for batch in $(seq 1 30); do
            url="$SITE_URL/api/admin/age-floor?dry=true&limit=200"
            if [ -n "$after" ]; then url="$url&afterId=$after"; fi
            response=$(curl -sSL --max-time 80 -X POST \
              -H "Authorization: Bearer $CRON_SECRET" "$url" 2>/dev/null)
            echo "$response" | jq '{processed, raised, done, sample: (.changes[0:20])}' 2>/dev/null || echo "$response"
            raised=$(echo "$response" | jq -r '.raised // 0' 2>/dev/null || echo 0)
            processed=$(echo "$response" | jq -r '.processed // 0' 2>/dev/null || echo 0)
            total_raised=$((total_raised + raised))
            total_processed=$((total_processed + processed))
            done_flag=$(echo "$response" | jq -r '.done // false' 2>/dev/null || echo true)
            after=$(echo "$response" | jq -r '.lastId // empty' 2>/dev/null || echo "")
            if [ "$done_flag" = "true" ] || [ -z "$after" ]; then break; fi
            sleep 1
          done
          echo "TOTAL processed=$total_processed raised=$total_raised (dry run — nothing written)"
          echo "::endgroup::"
