# TEMPORARY — one-off age-floor APPLY run, triggered by pushing this branch.
# Owner approved applying the 472 raises surfaced by the dry run (same sweep,
# dry=false). Identical to the age-floor job in cron.yml. Delete the branch
# after reading the results; this file must never land on main.
name: Age Floor Apply (one-off)

on:
  push:
    branches:
      - claude/age-floor-dryrun

jobs:
  age-floor-apply:
    name: Age Floor Sweep (apply)
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 15
    env:
      SITE_URL: ${{ secrets.SITE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Sweep deterministic age floors (apply)
        run: |
          set +e
          echo "::group::Age floor sweep (apply)"
          after=""
          total_raised=0
          total_processed=0
          for batch in $(seq 1 30); do
            url="$SITE_URL/api/admin/age-floor?limit=200"
            if [ -n "$after" ]; then url="$url&afterId=$after"; fi
            response=$(curl -sSL --max-time 80 -X POST \
              -H "Authorization: Bearer $CRON_SECRET" "$url" 2>/dev/null)
            echo "$response" | jq '{processed, raised, done, sample: (.changes[0:10])}' 2>/dev/null || echo "$response"
            raised=$(echo "$response" | jq -r '.raised // 0' 2>/dev/null || echo 0)
            processed=$(echo "$response" | jq -r '.processed // 0' 2>/dev/null || echo 0)
            total_raised=$((total_raised + raised))
            total_processed=$((total_processed + processed))
            done_flag=$(echo "$response" | jq -r '.done // false' 2>/dev/null || echo true)
            after=$(echo "$response" | jq -r '.lastId // empty' 2>/dev/null || echo "")
            if [ "$done_flag" = "true" ] || [ -z "$after" ]; then break; fi
            sleep 1
          done
          echo "TOTAL processed=$total_processed raised=$total_raised (APPLIED)"
          echo "::endgroup::"
