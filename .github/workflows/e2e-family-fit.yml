name: E2E — Family fit

# Locks in the family-filter / disliked-genre regression coverage. Runs on
# every PR plus pushes to main. Uses a Postgres service container + the
# dev-only /api/test/seed-family route to provision deterministic data.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e-family-fit:
    name: Family fit + recommendations + age vote (Playwright)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: totem
          POSTGRES_PASSWORD: totem
          POSTGRES_DB: totem_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U totem -d totem_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://totem:totem@localhost:5432/totem_test
      DIRECT_URL: postgresql://totem:totem@localhost:5432/totem_test
      AUTH_SECRET: ci-e2e-secret-placeholder
      NEXTAUTH_URL: http://localhost:3000
      TMDB_API_KEY: ci-placeholder
      NODE_ENV: test
      # `next start` forces NODE_ENV=production at runtime; the seed route is
      # guarded in prod unless this flag is set. Safe here: localhost + isolated
      # Postgres service container, never deployed to public production.
      ALLOW_TEST_SEED: "true"
      # Tells playwright.config.ts to skip its auto-spawned dev server — we
      # boot `npm start` ourselves below so the build is exercised.
      PLAYWRIGHT_BASE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Push schema to test database
        run: npx prisma db push --accept-data-loss --skip-generate

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build app
        run: npm run build

      - name: Start app in background
        run: |
          npm start &
          npx wait-on http://localhost:3000 --timeout 60000

      - name: Run family-fit Playwright specs
        run: npx playwright test family-fit-flow family-recommendations community-age-vote

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
