name: Scheduled Maintenance

on:
  schedule:
    # Daily 3:00 AM UTC — Import new content (was weekly Monday). The
    # homepage "Fraîchement ajoutés" rail looked stuck at "il y a 1
    # semaine" between Monday runs; daily imports keep it visibly
    # dynamic. TMDB dedup handles the daily cadence natively (most
    # popular titles are already in the catalog after a few days),
    # so actual new items per run drop to ~10-20 vs the original 80
    # weekly batch — same volume spread evenly. Enrichment cron at
    # 0 4 * * * picks up the new isEnriched=false rows the same day.
    - cron: "0 3 * * *"
    # Daily 4:00 AM UTC — Enrichment + deep enrichment + quality scores
    - cron: "0 4 * * *"
    # Four times daily — News discovery, OFF the top of the hour
    # (00:17 / 06:17 / 12:17 / 18:17 UTC). The exact-:00 schedule was
    # hitting GitHub's free-runner peak congestion ("job was not
    # acquired by Runner of type hosted even after multiple attempts"
    # failures), since every cron with `0 * * * *` syntax queues at
    # the same instant. Shifting +17min puts us in a low-contention
    # window. Dedup pipeline (URL + title fingerprint) handles drift.
    - cron: "17 0,6,12,18 * * *"
    # Saturday 5:00 AM UTC — Ratings backfill + streaming + similarity
    - cron: "0 5 * * 6"
    # Tuesday + Friday 5:00 AM UTC — Twice-weekly dossier ("Dossier de
    # la semaine") synthesizes a deeper long-read from the past 7 days
    # of briefs. Tuesday catches weekend + Monday news for early-week
    # reading; Friday gathers the week's themes for weekend reading.
    - cron: "0 5 * * 2,5"
    # Monday 6:00 AM UTC — editorial agent email with family-content
    # priorities (manual validation before publication).
    - cron: "0 6 * * 1"
    # Daily 7:00 AM UTC — supervisor checks cron health and tries
    # limited safe remediations before sending one digest if needed.
    - cron: "0 7 * * *"
    # Wednesday 6:13 AM UTC — weekly tech/data-debt digest. Off-the-hour
    # (:13) to dodge GitHub's top-of-hour runner congestion, same as
    # news-discover. Mid-week so it's not competing with the Mon/Sat
    # batches and lands while there's a working day to act on it.
    - cron: "13 6 * * 3"
    # Thursday 6:23 AM UTC — weekly SEO "striking distance" report. Pulls
    # Search Console queries ranking pos. 8–20 and proposes the on-page
    # nudge to push them onto page 1. Off-the-hour (:23), Thursday to
    # spread load off the Wed debt-digest.
    - cron: "23 6 * * 4"
  workflow_dispatch:
    inputs:
      task:
        description: "Which task to run"
        required: true
        type: choice
        options:
          - all
          - import
          - backfill-ratings
          - enrich
          - enrich-deep
          - quality
          - streaming
          - similarity
          - news-discover
          - news-prewarm-images-v4
          - news-press-kit-scout
          - weekly-dossier
          - family-content-agent
          - supervisor
          - debt-digest
          - seo-striking-distance

env:
  SITE_URL: ${{ secrets.SITE_URL }}
  CRON_SECRET: ${{ secrets.CRON_SECRET }}

jobs:
  # ── Daily: Import new content (was Monday-only) ──────────────────
  monday:
    name: Daily Import
    runs-on: ubuntu-latest
    environment: Production
    if: >-
      github.event.schedule == '0 3 * * *' ||
      github.event.inputs.task == 'import' ||
      github.event.inputs.task == 'all'
    steps:
      - name: Import movies & TV shows
        run: |
          echo "::group::Daily import"
          response=$(curl -sSfL -w "\n%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/weekly-import")
          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | sed '$d')
          echo "$body" | jq . 2>/dev/null || echo "$body"
          if [ "$http_code" -ge 400 ]; then
            echo "::error::Import failed with HTTP $http_code"
            exit 1
          fi
          echo "::endgroup::"

      - name: Import games from IGDB
        # Recent + popular console releases, defensively filtered to
        # total_rating_count >= 20 so the homepage "Sortis récemment
        # en jeux vidéo" rail and /jeux releaseDate browse stay free
        # of obscure indie shovelware.
        run: |
          set +e
          echo "::group::Weekly games import"
          curl -sSfL --max-time 58 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/weekly-games-import" \
            | jq '{stats, sources}' 2>/dev/null || true
          echo "::endgroup::"

      - name: Import CNC ratings (50 films)
        run: |
          set +e
          echo "::group::CNC ratings import"
          curl -sSL --max-time 280 -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/admin/import-cnc-ratings?limit=50&only_missing=true" \
            | jq '{matched, updated, errors, total}' 2>/dev/null || true
          echo "::endgroup::"

  # ── Daily: Enrichment + deep enrichment + quality scores ─────────
  daily-enrich:
    name: Daily Enrichment & Quality
    runs-on: ubuntu-latest
    environment: Production
    if: >-
      github.event.schedule == '0 4 * * *' ||
      github.event.inputs.task == 'enrich' ||
      github.event.inputs.task == 'enrich-deep' ||
      github.event.inputs.task == 'quality' ||
      github.event.inputs.task == 'all'
    steps:
      - name: Enrich movies (2 batches of 5)
        if: >-
          github.event.inputs.task != 'quality'
        run: |
          echo "::group::Enrich movies"
          for i in 1 2; do
            echo "Movie batch $i:"
            curl -sSL --max-time 290 -X POST \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "Content-Type: application/json" \
              -d '{"type":"movie","limit":5}' \
              "$SITE_URL/api/admin/enrich" | jq . 2>/dev/null || true
          done
          echo "::endgroup::"

      - name: Enrich TV shows (2 batches of 5)
        if: >-
          github.event.inputs.task != 'quality'
        run: |
          echo "::group::Enrich TV"
          for i in 1 2; do
            echo "TV batch $i:"
            curl -sSL --max-time 290 -X POST \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "Content-Type: application/json" \
              -d '{"type":"tv","limit":5}' \
              "$SITE_URL/api/admin/enrich" | jq . 2>/dev/null || true
          done
          echo "::endgroup::"

      - name: Enrich games (2 batches of 5)
        if: >-
          github.event.inputs.task != 'quality'
        run: |
          echo "::group::Enrich games"
          for i in 1 2; do
            echo "Game batch $i:"
            curl -sSL --max-time 290 -X POST \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "Content-Type: application/json" \
              -d '{"type":"game","limit":5}' \
              "$SITE_URL/api/admin/enrich" | jq . 2>/dev/null || true
          done
          echo "::endgroup::"

      - name: Deep enrichment (Pass 2 - GPT-5 + web search)
        if: >-
          github.event.inputs.task != 'quality' &&
          github.event.inputs.task != 'enrich'
        run: |
          set +e
          echo "::group::Deep enrich"
          for i in 1 2; do
            response=$(curl -sSL --max-time 55 -X POST \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "Content-Type: application/json" \
              -d '{"limit":3}' \
              "$SITE_URL/api/admin/enrich-deep" 2>&1)
            remaining=$(echo "$response" | jq -r '.remaining // 0' 2>/dev/null || echo "0")
            enriched=$(echo "$response" | jq -r '.result.enriched // 0' 2>/dev/null || echo "0")
            echo "Batch $i: $enriched deep-enriched, $remaining remaining"
            if [ "$remaining" = "0" ]; then break; fi
            sleep 3
          done
          echo "::endgroup::"

      - name: Recompute quality scores (all items)
        run: |
          set +e
          echo "::group::Quality scores"
          offset=0
          failures=0
          for batch in $(seq 1 100); do
            response=$(curl -sSL --max-time 55 -X POST \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "Content-Type: application/json" \
              -d "{\"limit\":200,\"offset\":$offset}" \
              "$SITE_URL/api/admin/quality/compute" 2>/dev/null)
            if [ -z "$response" ]; then
              failures=$((failures + 1))
              echo "Batch $batch: timeout or error (failure $failures/3)"
              if [ $failures -ge 3 ]; then
                echo "Too many failures, stopping quality recompute"
                break
              fi
              continue
            fi
            failures=0
            echo "$response" | jq -r '.progress // empty' 2>/dev/null || true
            done_flag=$(echo "$response" | jq -r '.done // false' 2>/dev/null || echo "false")
            if [ "$done_flag" = "true" ]; then
              echo "Quality score computation complete"
              break
            fi
            offset=$(echo "$response" | jq -r '.nextOffset // 0' 2>/dev/null || echo "0")
            if [ "$offset" = "null" ] || [ "$offset" = "0" ]; then
              break
            fi
          done
          echo "::endgroup::"

  # ── Saturday: TMDB ratings + streaming platforms + similarity ─────
  saturday:
    name: Ratings, Streaming & Similarity
    runs-on: ubuntu-latest
    environment: Production
    # Similarity now runs 50-item batches against a 300s function
    # ceiling, looped up to 20×, so this job can legitimately run close
    # to an hour. Cap well above that but below GitHub's 6h default so
    # a wedged runner can't sit in the queue all day.
    timeout-minutes: 150
    if: >-
      github.event.schedule == '0 5 * * 6' ||
      github.event.inputs.task == 'backfill-ratings' ||
      github.event.inputs.task == 'streaming' ||
      github.event.inputs.task == 'similarity' ||
      github.event.inputs.task == 'all'
    steps:
      - name: Backfill TMDB ratings (loop until done)
        if: >-
          github.event.inputs.task != 'streaming' &&
          github.event.inputs.task != 'similarity'
        run: |
          set +e
          echo "::group::Backfill ratings"
          # 50 items/batch; loop enough times to drain the current
          # backlog (~1400 items) in a single Saturday run.
          for i in $(seq 1 35); do
            response=$(curl -sSL --max-time 55 -X POST \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$SITE_URL/api/admin/backfill-ratings" 2>/dev/null)
            remaining=$(echo "$response" | jq -r '.remaining // 0' 2>/dev/null || echo "0")
            updated=$(echo "$response" | jq -r '.updated // 0' 2>/dev/null || echo "0")
            echo "Batch $i: updated=$updated remaining=$remaining"
            if [ "$remaining" = "0" ]; then
              echo "All ratings backfilled"
              break
            fi
            sleep 2
          done
          echo "::endgroup::"

      - name: Update streaming platforms - Movies
        if: >-
          github.event.inputs.task != 'backfill-ratings' &&
          github.event.inputs.task != 'similarity'
        run: |
          echo "::group::Streaming movies"
          for offset in 0 50 100; do
            curl -sSL -X POST \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "Content-Type: application/json" \
              -d "{\"limit\":50,\"offset\":$offset,\"mediaType\":\"MOVIE\"}" \
              "$SITE_URL/api/admin/streaming/update" | jq -r '.stats.updated // 0' 2>/dev/null
            sleep 1
          done
          echo "::endgroup::"

      - name: Update streaming platforms - TV
        if: >-
          github.event.inputs.task != 'backfill-ratings' &&
          github.event.inputs.task != 'similarity'
        run: |
          echo "::group::Streaming TV"
          for offset in 0 50 100; do
            curl -sSL -X POST \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "Content-Type: application/json" \
              -d "{\"limit\":50,\"offset\":$offset,\"mediaType\":\"TV\"}" \
              "$SITE_URL/api/admin/streaming/update" | jq -r '.stats.updated // 0' 2>/dev/null
            sleep 1
          done
          echo "::endgroup::"

      - name: Compute similarity scores
        if: >-
          github.event.inputs.task != 'backfill-ratings' &&
          github.event.inputs.task != 'streaming'
        run: |
          echo "::group::Similarity"
          # 50 items/batch against the route's 300s ceiling; --max-time
          # 290 lets curl actually wait for the function instead of
          # bailing at 55s (which previously made every batch after the
          # first "fail" and the catalog never drained past ~10 items).
          # 20 iterations = up to ~1000 freshest items/run; older rows
          # get refreshed when they're next touched (orderBy updatedAt).
          offset=0
          failures=0
          for batch in $(seq 1 20); do
            response=$(curl -sSL --max-time 290 -X POST \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "Content-Type: application/json" \
              -d "{\"mode\":\"full\",\"limit\":50,\"offset\":$offset}" \
              "$SITE_URL/api/admin/similarity/compute" 2>/dev/null)
            if [ -z "$response" ]; then
              failures=$((failures + 1))
              echo "Similarity batch $batch: empty response (failure $failures/3)"
              if [ $failures -ge 3 ]; then
                break
              fi
              continue
            fi
            failures=0
            echo "$response" | jq . 2>/dev/null || echo "$response"
            done_flag=$(echo "$response" | jq -r '.done // false' 2>/dev/null || echo "false")
            if [ "$done_flag" = "true" ]; then
              echo "Similarity computation complete"
              break
            fi
            next_offset=$(echo "$response" | jq -r '.nextOffset // empty' 2>/dev/null || echo "")
            if [ -z "$next_offset" ] || [ "$next_offset" = "null" ] || [ "$next_offset" -le "$offset" ]; then
              echo "Similarity stopped: no forward nextOffset"
              break
            fi
            offset=$next_offset
            sleep 1
          done
          echo "::endgroup::"

  # ── Daily: News discovery (admin-only synthesized news feed) ──────
  daily-news-discover:
    name: Daily News Discover
    runs-on: ubuntu-latest
    environment: Production
    # Hard upper bound — the underlying API has a 300s ceiling and the
    # curl --max-time below is 320s, so 10 minutes leaves slack for
    # job startup + checkout. Without this, a stuck runner could sit
    # in the queue for 6 hours (GitHub's default) and we'd never know.
    timeout-minutes: 10
    if: >-
      github.event.schedule == '17 0,6,12,18 * * *' ||
      github.event.inputs.task == 'news-discover' ||
      github.event.inputs.task == 'news-prewarm-images-v4' ||
      github.event.inputs.task == 'news-press-kit-scout' ||
      github.event.inputs.task == 'all'
    steps:
      - name: Run news discovery
        if: >-
          github.event.inputs.task != 'news-prewarm-images-v4' &&
          github.event.inputs.task != 'news-press-kit-scout'
        run: |
          echo "::group::News Discover"
          # 320s — slightly OVER the route's 300s ceiling so curl waits
          # long enough to receive Vercel's 504 response when the
          # function actually times out. Route has its own per-call
          # timeouts (synthesis 180s, others 20-30s) and returns the
          # error reason in the response body even on 5xx, so we drop
          # curl's --fail flag (-f) here and check $http_code manually.
          # Otherwise curl exits before printing the body, hiding the
          # actual error (we observed exit 22 with no diagnostic text).
          response=$(curl -sSL --max-time 320 -w "\n%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/news-discover")
          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | sed '$d')
          echo "$body" | jq . 2>/dev/null || echo "$body"
          if [ "$http_code" -ge 400 ]; then
            echo "::error::News discover failed with HTTP $http_code (see response body above)"
            exit 1
          fi
          echo "::endgroup::"

      - name: Scout official press kits
        if: >-
          github.event.inputs.task != 'news-prewarm-images-v4'
        run: |
          echo "::group::Scout official press kits"
          after_id=""
          for batch in $(seq 1 3); do
            url="$SITE_URL/api/admin/news/press-kit-scout?limit=40&days=21"
            if [ -n "$after_id" ]; then
              url="$url&afterId=$after_id"
            fi
            response=$(curl -sSL --max-time 58 -X POST -w "\n%{http_code}" \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$url")
            http_code=$(echo "$response" | tail -1)
            body=$(echo "$response" | sed '$d')
            echo "$body" | jq . 2>/dev/null || echo "$body"
            if [ "$http_code" -ge 400 ]; then
              echo "::error::Press kit scout failed with HTTP $http_code (see response body above)"
              exit 1
            fi
            done_flag=$(echo "$body" | jq -r '.done // false' 2>/dev/null || echo "false")
            after_id=$(echo "$body" | jq -r '.lastId // empty' 2>/dev/null || echo "")
            if [ "$done_flag" = "true" ] || [ -z "$after_id" ]; then
              echo "Press kit scout complete"
              break
            fi
            sleep 1
          done
          echo "::endgroup::"

      - name: Prewarm Discover V4 images
        if: >-
          github.event.inputs.task != 'news-press-kit-scout'
        run: |
          echo "::group::Prewarm Discover V4 images"
          after_id=""
          for batch in $(seq 1 5); do
            url="$SITE_URL/api/admin/news/prewarm-images-v4?limit=8"
            if [ -n "$after_id" ]; then
              url="$url&afterId=$after_id"
            fi
            response=$(curl -sSL --max-time 58 -X POST -w "\n%{http_code}" \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$url")
            http_code=$(echo "$response" | tail -1)
            body=$(echo "$response" | sed '$d')
            echo "$body" | jq . 2>/dev/null || echo "$body"
            if [ "$http_code" -ge 400 ]; then
              echo "::error::V4 image prewarm failed with HTTP $http_code (see response body above)"
              exit 1
            fi
            done_flag=$(echo "$body" | jq -r '.done // false' 2>/dev/null || echo "false")
            after_id=$(echo "$body" | jq -r '.lastId // empty' 2>/dev/null || echo "")
            if [ "$done_flag" = "true" ] || [ -z "$after_id" ]; then
              echo "V4 image prewarm complete"
              break
            fi
            sleep 2
          done
          echo "::endgroup::"

  # ── Monday 06:00 UTC: family content editorial agent ─────────────
  family-content-agent:
    name: Family Content Agent
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 5
    if: >-
      github.event.schedule == '0 6 * * 1' ||
      github.event.inputs.task == 'family-content-agent' ||
      github.event.inputs.task == 'all'
    steps:
      - name: Send weekly family content priorities
        run: |
          echo "::group::Family content agent"
          response=$(curl -sSfL --max-time 130 -w "\n%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/family-content-agent")
          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | sed '$d')
          echo "$body" | jq . 2>/dev/null || echo "$body"
          if [ "$http_code" -ge 400 ]; then
            echo "::error::Family content agent failed with HTTP $http_code"
            exit 1
          fi
          echo "::endgroup::"

  # ── Daily 07:00 UTC: supervisor + limited auto-remediation ───────
  supervisor:
    name: Cron Supervisor
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 6
    if: >-
      github.event.schedule == '0 7 * * *' ||
      github.event.inputs.task == 'supervisor' ||
      github.event.inputs.task == 'all'
    steps:
      - name: Check cron health and remediate safe failures
        run: |
          echo "::group::Cron supervisor"
          response=$(curl -sSL --max-time 190 -w "\n%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/supervisor")
          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | sed '$d')
          echo "$body" | jq . 2>/dev/null || echo "$body"
          if [ "$http_code" -ge 400 ]; then
            echo "::error::Cron supervisor failed with HTTP $http_code"
            exit 1
          fi
          echo "::endgroup::"

  # ── Tuesday + Friday 05:00 UTC: Weekly dossier (long-read synthesis) ────────
  weekly-dossier:
    name: Weekly Dossier
    runs-on: ubuntu-latest
    environment: Production
    if: >-
      github.event.schedule == '0 5 * * 2,5' ||
      github.event.inputs.task == 'weekly-dossier' ||
      github.event.inputs.task == 'all'
    steps:
      - name: Synthesize weekly dossier
        run: |
          echo "::group::Weekly dossier"
          # 290s — long-read agent runs one big LLM call (~30-60s) + image mirror.
          response=$(curl -sSfL --max-time 290 -w "\n%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/weekly-dossier")
          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | sed '$d')
          echo "$body" | jq . 2>/dev/null || echo "$body"
          if [ "$http_code" -ge 400 ]; then
            echo "::error::Weekly dossier failed with HTTP $http_code"
            exit 1
          fi
          echo "::endgroup::"

  # ── Wednesday 06:13 UTC: weekly tech/data-debt digest ────────────
  debt-digest:
    name: Debt Digest
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 5
    if: >-
      github.event.schedule == '13 6 * * 3' ||
      github.event.inputs.task == 'debt-digest' ||
      github.event.inputs.task == 'all'
    steps:
      - name: Compile and email the debt digest
        run: |
          echo "::group::Debt digest"
          response=$(curl -sSfL --max-time 90 -w "\n%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/debt-digest")
          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | sed '$d')
          echo "$body" | jq . 2>/dev/null || echo "$body"
          if [ "$http_code" -ge 400 ]; then
            echo "::error::Debt digest failed with HTTP $http_code"
            exit 1
          fi
          echo "::endgroup::"

  seo-striking-distance:
    name: SEO striking distance
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 5
    if: >-
      github.event.schedule == '23 6 * * 4' ||
      github.event.inputs.task == 'seo-striking-distance' ||
      github.event.inputs.task == 'all'
    steps:
      - name: Pull GSC striking-distance queries and email the report
        run: |
          echo "::group::SEO striking distance"
          response=$(curl -sSfL --max-time 90 -w "\n%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/seo-striking-distance")
          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | sed '$d')
          echo "$body" | jq . 2>/dev/null || echo "$body"
          if [ "$http_code" -ge 400 ]; then
            echo "::error::SEO striking-distance failed with HTTP $http_code"
            exit 1
          fi
          echo "::endgroup::"
