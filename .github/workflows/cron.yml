name: Scheduled Maintenance

on:
  schedule:
    # ┌─── Weekly import: Monday 3:00 AM UTC (backup for Vercel cron)
    - cron: "0 3 * * 1"
    # ┌─── Enrichment + quality: Wednesday 4:00 AM UTC
    - cron: "0 4 * * 3"
    # ┌─── Streaming + ratings: Friday 4:00 AM UTC
    - cron: "0 4 * * 5"
  workflow_dispatch:
    inputs:
      task:
        description: "Which task to run"
        required: true
        type: choice
        options:
          - all
          - import
          - backfill-ratings
          - enrich
          - quality
          - streaming
          - similarity

env:
  SITE_URL: ${{ secrets.SITE_URL }}
  CRON_SECRET: ${{ secrets.CRON_SECRET }}

jobs:
  # ── Monday: Import new content from TMDB ──────────────────────────
  import:
    name: Weekly Import
    runs-on: ubuntu-latest
    if: >-
      github.event.schedule == '0 3 * * 1' ||
      github.event.inputs.task == 'import' ||
      github.event.inputs.task == 'all'
    steps:
      - name: Import movies & TV shows
        run: |
          echo "::group::Weekly import"
          response=$(curl -sf -w "\n%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/weekly-import")
          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | sed '$d')
          echo "$body" | jq . 2>/dev/null || echo "$body"
          if [ "$http_code" -ge 400 ]; then
            echo "::error::Import failed with HTTP $http_code"
            exit 1
          fi
          echo "::endgroup::"

  # ── Wednesday: AI enrichment + quality scores ─────────────────────
  enrich:
    name: AI Enrichment & Quality
    runs-on: ubuntu-latest
    if: >-
      github.event.schedule == '0 4 * * 3' ||
      github.event.inputs.task == 'enrich' ||
      github.event.inputs.task == 'quality' ||
      github.event.inputs.task == 'all'
    steps:
      - name: Enrich movies (batch of 20)
        if: >-
          github.event.inputs.task != 'quality'
        run: |
          echo "::group::Enrich movies"
          curl -sf -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d '{"type":"movie","limit":20}' \
            "$SITE_URL/api/admin/enrich" | jq . 2>/dev/null || true
          echo "::endgroup::"

      - name: Enrich TV shows (batch of 20)
        if: >-
          github.event.inputs.task != 'quality'
        run: |
          echo "::group::Enrich TV"
          curl -sf -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d '{"type":"tv","limit":20}' \
            "$SITE_URL/api/admin/enrich" | jq . 2>/dev/null || true
          echo "::endgroup::"

      - name: Enrich games (batch of 10)
        if: >-
          github.event.inputs.task != 'quality'
        run: |
          echo "::group::Enrich games"
          curl -sf -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d '{"type":"game","limit":10}' \
            "$SITE_URL/api/admin/enrich" | jq . 2>/dev/null || true
          echo "::endgroup::"

      - name: Recompute quality scores (all items)
        run: |
          echo "::group::Quality scores"
          offset=0
          while true; do
            response=$(curl -sf -X POST \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "Content-Type: application/json" \
              -d "{\"limit\":500,\"offset\":$offset}" \
              "$SITE_URL/api/admin/quality/compute")
            echo "$response" | jq -r '.progress // empty' 2>/dev/null
            done=$(echo "$response" | jq -r '.done // false' 2>/dev/null)
            if [ "$done" = "true" ]; then
              echo "Quality score computation complete"
              break
            fi
            offset=$(echo "$response" | jq -r '.nextOffset // 0' 2>/dev/null)
            if [ "$offset" = "null" ] || [ "$offset" = "0" ]; then
              break
            fi
          done
          echo "::endgroup::"

  # ── Friday: TMDB ratings backfill + streaming platforms ───────────
  backfill:
    name: Ratings & Streaming
    runs-on: ubuntu-latest
    if: >-
      github.event.schedule == '0 4 * * 5' ||
      github.event.inputs.task == 'backfill-ratings' ||
      github.event.inputs.task == 'streaming' ||
      github.event.inputs.task == 'all'
    steps:
      - name: Backfill TMDB ratings (loop until done)
        if: >-
          github.event.inputs.task != 'streaming'
        run: |
          echo "::group::Backfill ratings"
          for i in $(seq 1 20); do
            response=$(curl -sf -X POST \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$SITE_URL/api/admin/backfill-ratings")
            remaining=$(echo "$response" | jq -r '.remaining // 0' 2>/dev/null)
            updated=$(echo "$response" | jq -r '.updated // 0' 2>/dev/null)
            echo "Batch $i: updated=$updated remaining=$remaining"
            if [ "$remaining" = "0" ]; then
              echo "All ratings backfilled"
              break
            fi
            sleep 2
          done
          echo "::endgroup::"

      - name: Update streaming platforms - Movies
        if: >-
          github.event.inputs.task != 'backfill-ratings'
        run: |
          echo "::group::Streaming movies"
          for offset in 0 50 100; do
            curl -sf -X POST \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "Content-Type: application/json" \
              -d "{\"limit\":50,\"offset\":$offset,\"mediaType\":\"MOVIE\"}" \
              "$SITE_URL/api/admin/streaming/update" | jq -r '.stats.updated // 0' 2>/dev/null
            sleep 1
          done
          echo "::endgroup::"

      - name: Update streaming platforms - TV
        if: >-
          github.event.inputs.task != 'backfill-ratings'
        run: |
          echo "::group::Streaming TV"
          for offset in 0 50 100; do
            curl -sf -X POST \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "Content-Type: application/json" \
              -d "{\"limit\":50,\"offset\":$offset,\"mediaType\":\"TV\"}" \
              "$SITE_URL/api/admin/streaming/update" | jq -r '.stats.updated // 0' 2>/dev/null
            sleep 1
          done
          echo "::endgroup::"

      - name: Compute similarity scores
        if: >-
          github.event.inputs.task != 'backfill-ratings' &&
          github.event.inputs.task != 'streaming'
        run: |
          echo "::group::Similarity"
          curl -sf -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d '{"limit":100}' \
            "$SITE_URL/api/admin/similarity/compute" | jq . 2>/dev/null || true
          echo "::endgroup::"
