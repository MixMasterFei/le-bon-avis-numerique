name: Scheduled Maintenance

on:
  schedule:
    # Monday 3:00 AM UTC — Import new content
    - cron: "0 3 * * 1"
    # Daily 4:00 AM UTC — Enrichment + deep enrichment + quality scores
    - cron: "0 4 * * *"
    # Twice daily — News discovery (06:00 + 18:00 UTC). Dedup pipeline
    # handles re-runs natively (URL fingerprint + title fingerprint).
    - cron: "0 6 * * *"
    - cron: "0 18 * * *"
    # Saturday 5:00 AM UTC — Ratings backfill + streaming + similarity
    - cron: "0 5 * * 6"
  workflow_dispatch:
    inputs:
      task:
        description: "Which task to run"
        required: true
        type: choice
        options:
          - all
          - import
          - backfill-ratings
          - enrich
          - enrich-deep
          - quality
          - streaming
          - similarity
          - news-discover

env:
  SITE_URL: ${{ secrets.SITE_URL }}
  CRON_SECRET: ${{ secrets.CRON_SECRET }}

jobs:
  # ── Monday: Import new content ────────────────────────────────────
  monday:
    name: Weekly Import
    runs-on: ubuntu-latest
    environment: Production
    if: >-
      github.event.schedule == '0 3 * * 1' ||
      github.event.inputs.task == 'import' ||
      github.event.inputs.task == 'all'
    steps:
      - name: Import movies & TV shows
        run: |
          echo "::group::Weekly import"
          response=$(curl -sSfL -w "\n%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/weekly-import")
          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | sed '$d')
          echo "$body" | jq . 2>/dev/null || echo "$body"
          if [ "$http_code" -ge 400 ]; then
            echo "::error::Import failed with HTTP $http_code"
            exit 1
          fi
          echo "::endgroup::"

      - name: Import CNC ratings (50 films)
        run: |
          set +e
          echo "::group::CNC ratings import"
          curl -sSL --max-time 280 -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/admin/import-cnc-ratings?limit=50&only_missing=true" \
            | jq '{matched, updated, errors, total}' 2>/dev/null || true
          echo "::endgroup::"

  # ── Daily: Enrichment + deep enrichment + quality scores ─────────
  daily-enrich:
    name: Daily Enrichment & Quality
    runs-on: ubuntu-latest
    environment: Production
    if: >-
      github.event.schedule == '0 4 * * *' ||
      github.event.inputs.task == 'enrich' ||
      github.event.inputs.task == 'enrich-deep' ||
      github.event.inputs.task == 'quality' ||
      github.event.inputs.task == 'all'
    steps:
      - name: Enrich movies (2 batches of 5)
        if: >-
          github.event.inputs.task != 'quality'
        run: |
          echo "::group::Enrich movies"
          for i in 1 2; do
            echo "Movie batch $i:"
            curl -sSL --max-time 58 -X POST \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "Content-Type: application/json" \
              -d '{"type":"movie","limit":5}' \
              "$SITE_URL/api/admin/enrich" | jq . 2>/dev/null || true
          done
          echo "::endgroup::"

      - name: Enrich TV shows (2 batches of 5)
        if: >-
          github.event.inputs.task != 'quality'
        run: |
          echo "::group::Enrich TV"
          for i in 1 2; do
            echo "TV batch $i:"
            curl -sSL --max-time 58 -X POST \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "Content-Type: application/json" \
              -d '{"type":"tv","limit":5}' \
              "$SITE_URL/api/admin/enrich" | jq . 2>/dev/null || true
          done
          echo "::endgroup::"

      - name: Enrich games (2 batches of 5)
        if: >-
          github.event.inputs.task != 'quality'
        run: |
          echo "::group::Enrich games"
          for i in 1 2; do
            echo "Game batch $i:"
            curl -sSL --max-time 58 -X POST \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "Content-Type: application/json" \
              -d '{"type":"game","limit":5}' \
              "$SITE_URL/api/admin/enrich" | jq . 2>/dev/null || true
          done
          echo "::endgroup::"

      - name: Deep enrichment (Pass 2 - GPT-5 + web search)
        if: >-
          github.event.inputs.task != 'quality' &&
          github.event.inputs.task != 'enrich'
        run: |
          set +e
          echo "::group::Deep enrich"
          for i in 1 2; do
            response=$(curl -sSL --max-time 55 -X POST \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "Content-Type: application/json" \
              -d '{"limit":3}' \
              "$SITE_URL/api/admin/enrich-deep" 2>&1)
            remaining=$(echo "$response" | jq -r '.remaining // 0' 2>/dev/null || echo "0")
            enriched=$(echo "$response" | jq -r '.result.enriched // 0' 2>/dev/null || echo "0")
            echo "Batch $i: $enriched deep-enriched, $remaining remaining"
            if [ "$remaining" = "0" ]; then break; fi
            sleep 3
          done
          echo "::endgroup::"

      - name: Recompute quality scores (all items)
        run: |
          set +e
          echo "::group::Quality scores"
          offset=0
          failures=0
          for batch in $(seq 1 100); do
            response=$(curl -sSL --max-time 55 -X POST \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "Content-Type: application/json" \
              -d "{\"limit\":200,\"offset\":$offset}" \
              "$SITE_URL/api/admin/quality/compute" 2>/dev/null)
            if [ -z "$response" ]; then
              failures=$((failures + 1))
              echo "Batch $batch: timeout or error (failure $failures/3)"
              if [ $failures -ge 3 ]; then
                echo "Too many failures, stopping quality recompute"
                break
              fi
              continue
            fi
            failures=0
            echo "$response" | jq -r '.progress // empty' 2>/dev/null || true
            done_flag=$(echo "$response" | jq -r '.done // false' 2>/dev/null || echo "false")
            if [ "$done_flag" = "true" ]; then
              echo "Quality score computation complete"
              break
            fi
            offset=$(echo "$response" | jq -r '.nextOffset // 0' 2>/dev/null || echo "0")
            if [ "$offset" = "null" ] || [ "$offset" = "0" ]; then
              break
            fi
          done
          echo "::endgroup::"

  # ── Saturday: TMDB ratings + streaming platforms + similarity ─────
  saturday:
    name: Ratings, Streaming & Similarity
    runs-on: ubuntu-latest
    environment: Production
    if: >-
      github.event.schedule == '0 5 * * 6' ||
      github.event.inputs.task == 'backfill-ratings' ||
      github.event.inputs.task == 'streaming' ||
      github.event.inputs.task == 'similarity' ||
      github.event.inputs.task == 'all'
    steps:
      - name: Backfill TMDB ratings (loop until done)
        if: >-
          github.event.inputs.task != 'streaming' &&
          github.event.inputs.task != 'similarity'
        run: |
          set +e
          echo "::group::Backfill ratings"
          for i in $(seq 1 20); do
            response=$(curl -sSL --max-time 55 -X POST \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$SITE_URL/api/admin/backfill-ratings" 2>/dev/null)
            remaining=$(echo "$response" | jq -r '.remaining // 0' 2>/dev/null || echo "0")
            updated=$(echo "$response" | jq -r '.updated // 0' 2>/dev/null || echo "0")
            echo "Batch $i: updated=$updated remaining=$remaining"
            if [ "$remaining" = "0" ]; then
              echo "All ratings backfilled"
              break
            fi
            sleep 2
          done
          echo "::endgroup::"

      - name: Update streaming platforms - Movies
        if: >-
          github.event.inputs.task != 'backfill-ratings' &&
          github.event.inputs.task != 'similarity'
        run: |
          echo "::group::Streaming movies"
          for offset in 0 50 100; do
            curl -sSL -X POST \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "Content-Type: application/json" \
              -d "{\"limit\":50,\"offset\":$offset,\"mediaType\":\"MOVIE\"}" \
              "$SITE_URL/api/admin/streaming/update" | jq -r '.stats.updated // 0' 2>/dev/null
            sleep 1
          done
          echo "::endgroup::"

      - name: Update streaming platforms - TV
        if: >-
          github.event.inputs.task != 'backfill-ratings' &&
          github.event.inputs.task != 'similarity'
        run: |
          echo "::group::Streaming TV"
          for offset in 0 50 100; do
            curl -sSL -X POST \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "Content-Type: application/json" \
              -d "{\"limit\":50,\"offset\":$offset,\"mediaType\":\"TV\"}" \
              "$SITE_URL/api/admin/streaming/update" | jq -r '.stats.updated // 0' 2>/dev/null
            sleep 1
          done
          echo "::endgroup::"

      - name: Compute similarity scores
        if: >-
          github.event.inputs.task != 'backfill-ratings' &&
          github.event.inputs.task != 'streaming'
        run: |
          echo "::group::Similarity"
          curl -sSL -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d '{"limit":100}' \
            "$SITE_URL/api/admin/similarity/compute" | jq . 2>/dev/null || true
          echo "::endgroup::"

  # ── Daily: News discovery (admin-only synthesized news feed) ──────
  daily-news-discover:
    name: Daily News Discover
    runs-on: ubuntu-latest
    environment: Production
    if: >-
      github.event.schedule == '0 6 * * *' ||
      github.event.schedule == '0 18 * * *' ||
      github.event.inputs.task == 'news-discover' ||
      github.event.inputs.task == 'all'
    steps:
      - name: Run news discovery
        run: |
          echo "::group::News Discover"
          response=$(curl -sSfL --max-time 58 -w "\n%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/news-discover")
          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | sed '$d')
          echo "$body" | jq . 2>/dev/null || echo "$body"
          if [ "$http_code" -ge 400 ]; then
            echo "::error::News discover failed with HTTP $http_code"
            exit 1
          fi
          echo "::endgroup::"
