name: Lighthouse CI

# Runs Lighthouse against the Vercel preview deploy on PRs and on
# manual dispatch. Push-to-main was disabled (April 2026) because
# Vercel deployment-protection makes the auto-generated preview URL
# unreachable from public CI on direct pushes — every push produced a
# 13-minute timeout failure email with no actionable signal. Use
# workflow_dispatch to run an on-demand Lighthouse audit against prod.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_url:
        description: "URL to audit (defaults to production)"
        required: false
        default: "https://totemavise.com"

jobs:
  lighthouse:
    name: Performance budgets
    runs-on: ubuntu-latest
    # Allow the job to complete even if Vercel hasn't finished deploying
    # — lhci will retry the URL fetch a few times before failing.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.14.x

      # Resolve + wait for the Vercel preview ourselves: the pinned
      # wait-for-vercel-preview@v1.3.2 can't send the protection bypass (no
      # header input; it ignores `path` for the readiness GET), so it always
      # 401s on protection-gated previews. We poll with the bypass header
      # instead — which also definitively tests that the bypass secret works.
      - name: Wait for protected Vercel preview (PR only)
        id: vercel
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          # 1. Resolve the preview URL from the Vercel integration's deployment.
          url=""
          for i in $(seq 1 30); do
            for id in $(gh api "repos/${REPO}/deployments?sha=${HEAD_SHA}&per_page=30" --jq '.[].id' 2>/dev/null); do
              u=$(gh api "repos/${REPO}/deployments/${id}/statuses?per_page=10" \
                --jq 'first(.[] | select(.environment_url != null and (.environment_url|test("vercel\\.app"))) | .environment_url) // empty' 2>/dev/null || true)
              if [ -n "$u" ]; then url="$u"; break; fi
            done
            [ -n "$url" ] && break
            echo "waiting for preview deployment ($i/30)…"; sleep 10
          done
          if [ -z "$url" ]; then echo "::error::No Vercel preview URL found for ${HEAD_SHA}"; exit 1; fi
          echo "preview url: $url"
          # 2. Poll until live, bypassing Deployment Protection via the header.
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "x-vercel-protection-bypass: ${BYPASS}" -L "$url" || echo 000)
            echo "ready check $i: $code"
            if [ "$code" = "200" ]; then
              echo "url=$url" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Preview never returned 200 with the bypass header. Verify 'Protection Bypass for Automation' is enabled in Vercel and that VERCEL_AUTOMATION_BYPASS_SECRET matches the token Vercel generated."
          exit 1

      - name: Run Lighthouse CI
        run: lhci autorun
        env:
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}
          # PR runs use the Vercel preview URL; manual dispatch uses
          # the input (defaults to prod totemavise.com).
          LHCI_TARGET_URL: ${{ steps.vercel.outputs.url || github.event.inputs.target_url || 'https://totemavise.com' }}
          # lighthouserc.js sends this as x-vercel-protection-bypass so Chrome
          # can load the protected preview (no-op for the public prod URL).
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 30
