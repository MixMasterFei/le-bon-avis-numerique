name: Daily Filter Tests

# The catalogue filter suites (API + Films / Séries / Jeux pages), run against
# production with read-only requests.
#
# Truthful by construction (Nov 2026): until then every test step ran with
# continue-on-error, so the jobs were green and the summary said « Pass » over
# 16 failed tests. Now a failing test fails its job and the workflow, each E2E
# suite runs in its own job (one suite can no longer skip or hide another, and
# each keeps its own report), and the summary is computed from the Playwright
# JSON reports: passed / failed / flaky / retries, infrastructure failures
# called out separately. Do not add continue-on-error to a test step.

on:
  schedule:
    # Every day at 5:00 AM Paris time (4:00 AM UTC in winter, 3:00 AM UTC in summer)
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      test_scope:
        description: "Which tests to run"
        required: true
        type: choice
        options:
          - all
          - api-only
          - e2e-only

permissions:
  contents: read

env:
  PLAYWRIGHT_BASE_URL: https://totemavise.com

jobs:
  api-tests:
    name: API Filter Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      github.event.schedule ||
      github.event.inputs.test_scope == 'all' ||
      github.event.inputs.test_scope == 'api-only'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run API filter tests
        run: npx playwright test e2e/filters/api-filters.spec.ts --project=chromium

      - name: Upload results (read by the summary)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: filter-results-api
          path: playwright-results/results.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload API test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: filter-report-api
          path: |
            playwright-report/
            e2e/test-results/
          retention-days: 14

  e2e-tests:
    name: E2E Filter Tests (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      github.event.schedule ||
      github.event.inputs.test_scope == 'all' ||
      github.event.inputs.test_scope == 'e2e-only'
    strategy:
      fail-fast: false
      matrix:
        suite: [films, series, jeux]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft* /etc/apt/sources.list.d/azure* || true
          npx playwright install --with-deps chromium || npx playwright install chromium

      # One worker: every filter change is a server navigation on production,
      # and bursts from a single runner get refused by Vercel's edge
      # (« This request was blocked », 7–9 Nov 2026). For the same reason the
      # suites' browser keeps images, link prefetches and repeat downloads of
      # static files off the network (e2e/filters/fixtures.ts), and pauses
      # once before reloading when the edge refuses it (assertNotEdgeBlocked).
      - name: Run E2E filter tests (${{ matrix.suite }})
        run: npx playwright test e2e/filters/${{ matrix.suite }}-filters.spec.ts --project=chromium --workers=1

      - name: Upload results (read by the summary)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: filter-results-${{ matrix.suite }}
          path: playwright-results/results.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload report, traces and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: filter-report-${{ matrix.suite }}
          path: |
            playwright-report/
            e2e/test-results/
            e2e/screenshots/
          retention-days: 14

  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [api-tests, e2e-tests]
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Download suite results
        uses: actions/download-artifact@v5
        with:
          pattern: filter-results-*
          path: filter-results

      # Fails when any suite failed, errored outside its tests or left no
      # report; flaky tests are reported as warnings.
      - name: Summarize
        env:
          API_JOB: ${{ needs.api-tests.result }}
          E2E_JOB: ${{ needs.e2e-tests.result }}
        run: node scripts/ci/filter-test-summary.mjs filter-results
